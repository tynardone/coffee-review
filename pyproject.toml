[project]
name = "coffee-review"
version = "0.1.0"
description = "Scrape, parse, clean and enrich coffeereview.com reviews."
readme = "README.md"
authors = [
    { name = "Tyler Nardone", email = "tynardone@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiolimiter>=1.3.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.2",
]

[project.scripts]
coffee-review = "coffee_review.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
]
extend-ignore = [
    "TD003",    # TODOs need no issue link: docs/roadmap.md is the tracker
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-m", "not network"]
markers = [
    "slow: takes more than a second or two",
    "network: talks to a real external service; never run in CI",
]

[tool.coverage.run]
source = ["coffee_review"]
branch = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
