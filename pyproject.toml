[project]
name = "coffee-review"
version = "0.1.0"
description = "Scrape, parse, clean and enrich coffeereview.com reviews."
readme = "README.md"
authors = [
    { name = "Tyler Nardone", email = "tynardone@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiolimiter>=1.3.0",
    "httpx>=0.28.1",
    "marimo[recommended]>=0.26.0",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "pydantic-settings>=2.16.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "typer>=0.29.2",
]

[project.scripts]
coffee-review = "coffee_review.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "inline-snapshot>=0.37.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pycountry>=26.2.16",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
    "D",        # Docstrings (Google style; src only, see per-file-ignores)
]
extend-ignore = [
    "TD003",    # TODOs need no issue link: docs/roadmap.md is the tracker
    "D105",     # Magic methods (__eq__, __repr__, ...) explain themselves
    "D106",     # pandera's nested ``Config`` classes are settings, not API
    "D107",     # Constructor arguments are documented on the class (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and scripts are documented by their names and module docstrings.
"tests/**" = ["D"]
"scripts/**" = ["D"]
# marimo notebooks: every cell is a function, and none need docstrings.
"notebooks/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-m", "not network"]
markers = [
    "slow: takes more than a second or two",
    "network: talks to a real external service; never run in CI",
]

[tool.coverage.run]
source = ["coffee_review"]
branch = true

[tool.ruff.lint.flake8-type-checking]
# These classes read their annotations at runtime, so the types they use must
# be real imports, not TYPE_CHECKING-only ones.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pandera.polars.DataFrameModel"]

[tool.importlinter]
# The dependency rule (ADR 0002, docs/architecture.md), checked on every commit
# by `lint-imports`. Imports may only point down this list; packages on the same
# line (separated by |) may not import each other.
root_package = "coffee_review"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The dependency rule: cli → pipeline → workers → models and config"
type = "layers"
layers = [
    "coffee_review.cli",
    "coffee_review.pipeline | coffee_review.logging_setup | coffee_review.progress_display",
    "coffee_review.clients | coffee_review.storage | coffee_review.parsers | coffee_review.transforms",
    "coffee_review.models | coffee_review.config",
]

[[tool.importlinter.contracts]]
name = "Pure code does no network or database I/O"
type = "forbidden"
source_modules = [
    "coffee_review.parsers",
    "coffee_review.transforms",
    "coffee_review.models",
]
forbidden_modules = ["httpx", "sqlite3"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
