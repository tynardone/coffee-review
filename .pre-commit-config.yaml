# Runs on every `git commit` once installed with `uv run pre-commit install`.
# Run everything by hand with `uv run pre-commit run --all-files`.
#
# ruff and mypy run through `uv run`, so they use the exact versions pinned in
# uv.lock: the same versions CI and your editor use.
# NOTES.md is a personal scratch file; hooks leave it alone.
exclude: ^NOTES\.md$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (the dependency rule)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
